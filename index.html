<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway SignUp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">
        <aside class="sidebar">
            <div class="logo-banner">
                <img src="./images/logo.png" alt="fake railway logo lol" class="logo-img">
                <h1>Indian Railways</h1>
            </div>
        </aside>
        <main class="main-content">
            <header class="intro">
                <p>Welcome to Indian Railways Reservation Portal.<br>
                Create your User ID to book e-tickets and manage journeys.<br>
                Please fill in all mandatory details accurately.</p>
            </header>
            <section class="form-card">
                <h2>Passenger Registration</h2>
                <form id="signup-form" action="#" method="get">
                    <div class="input-group">
                        <label for="first-name">First Name *</label>
                        <input type="text" id="first-name" name="first_name" placeholder="e.g. Raj" required>
                    </div>
                    <div class="input-group">
                        <label for="last-name">Last Name *</label>
                        <input type="text" id="last-name" name="last_name" placeholder="e.g. Sharma" required>
                    </div>
                    <div class="input-group">
                        <label for="email">email *</label>
                        <input type="email" id="email" name="email" placeholder="rajesh@example.com" required>
                    </div>
                    <div class="input-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
                    </div>
                    <div class="input-group">
                        <label for="password">password *</label>
                        <input type="password" id="password" name="password" minlength="8" required>
                    </div>
                    <div class="input-group">
                        <label for="confirm-password">Confirm password *</label>
                        <input type="password" id="confirm-password" name="confirm_password" minlength="8" required>
                    </div>
                </form>
            </section>
            <div class="actions">
                <button type="submit" form="signup-form">Create Account</button>
                <p>Already have an IRCTC account? <a href="#">Log in</a></p>
            </div>
        </main>
    </div>
</body>
</html>
